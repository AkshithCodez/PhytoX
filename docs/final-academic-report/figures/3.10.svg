<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700"><rect width="100%" height="100%" fill="white"/><ellipse cx="700.0" cy="30.0" rx="20.0" ry="20.0" fill="black" stroke="black" stroke-width="3"/><line x1="700" y1="50" x2="700" y2="126" stroke="black" stroke-width="2.5"/><line x1="700" y1="126" x2="692.4699857892615" y2="111.88267426223806" stroke="black" stroke-width="2.5"/><line x1="700" y1="126" x2="707.5300142107385" y2="111.88267426223806" stroke="black" stroke-width="2.5"/><text x="920" y="92.68" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="28">reserve_diagnosis(request key)</text><rect x="445" y="128" width="510" height="146" rx="23" fill="white" stroke="black" stroke-width="3"/><text x="700.0" y="175.78" text-anchor="middle" font-family="Times New Roman" font-weight="700" font-size="38">processing</text><text x="700.0" y="223.99" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="29">Image path belongs to this request.</text><text x="700.0" y="259.99" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="29">Look up a compatible cached result.</text><line x1="700" y1="274" x2="700" y2="313" stroke="black" stroke-width="2.5"/><line x1="340" y1="313" x2="1060" y2="313" stroke="black" stroke-width="2.5"/><line x1="340" y1="313" x2="340" y2="432" stroke="black" stroke-width="2.5"/><line x1="340" y1="432" x2="332.46998578926144" y2="417.8826742622381" stroke="black" stroke-width="2.5"/><line x1="340" y1="432" x2="347.53001421073856" y2="417.8826742622381" stroke="black" stroke-width="2.5"/><line x1="1060" y1="313" x2="1060" y2="432" stroke="black" stroke-width="2.5"/><line x1="1060" y1="432" x2="1052.4699857892615" y2="417.8826742622381" stroke="black" stroke-width="2.5"/><line x1="1060" y1="432" x2="1067.5300142107385" y2="417.8826742622381" stroke="black" stroke-width="2.5"/><text x="160" y="362.37" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="27">[cache hit or valid</text><text x="160" y="395.37" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="27">inference response]</text><text x="1236" y="362.37" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="27">[inference error or</text><text x="1236" y="395.37" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="27">invalid response]</text><rect x="45" y="435" width="590" height="175" rx="23" fill="white" stroke="black" stroke-width="3"/><text x="340.0" y="482.78" text-anchor="middle" font-family="Times New Roman" font-weight="700" font-size="38">complete</text><text x="340.0" y="530.99" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="29">Persist the result and image path.</text><text x="340.0" y="566.99" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="29">A repeated key returns the record.</text><rect x="765" y="435" width="590" height="175" rx="23" fill="white" stroke="black" stroke-width="3"/><text x="1060.0" y="482.78" text-anchor="middle" font-family="Times New Roman" font-weight="700" font-size="38">failed</text><text x="1060.0" y="530.99" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="29">Persist the failure code.</text><text x="1060.0" y="566.99" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="29">A retry requires a new request key.</text><text x="700" y="676.99" text-anchor="middle" font-family="Times New Roman" font-weight="400" font-size="29">Each reserved record has one status; a fresh key creates a separate record.</text></svg>